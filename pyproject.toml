[project]
name = "reto2-secop-rag-mcp"
version = "0.1.0"
description = "Taller 02 · Agente analista del SECOP con RAG sobre pliegos, herramienta vía servidor MCP y memoria entre sesiones"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic",
    "langgraph",
    "langsmith",
    "langchain-mcp-adapters",
    "mcp[cli]",
    "chromadb",
    "sentence-transformers",
    "torch",
    "pypdf",
    "python-dotenv",
    "requests",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
secop-mcp = "secop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secop_agent", "src/secop_mcp"]

[dependency-groups]
dev = ["pytest", "ipykernel", "nbconvert", "nbclient", "jupyter"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
